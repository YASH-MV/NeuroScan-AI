<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <!-- Neon Brain Gradient -->
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Scan Reticle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Tech Scanning Ring -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 12" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" />

  <!-- Brain Hemisphere Outlines / Nodes -->
  <g filter="url(#glow)">
    <!-- Left Hemisphere -->
    <path d="M230 140 C170 140, 130 180, 130 240 C130 290, 160 330, 210 350 C220 354, 230 345, 230 335 Z" 
          fill="none" stroke="url(#brainGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Hemisphere -->
    <path d="M270 140 C330 140, 370 180, 370 240 C370 290, 340 330, 290 350 C280 354, 270 345, 270 335 Z" 
          fill="none" stroke="url(#brainGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Synapse Lines -->
    <path d="M200 200 Q230 220 180 260 T220 310" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M300 200 Q270 220 320 260 T280 310" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- AI Detection Reticle Target (Highlighting Detection) -->
  <circle cx="310" cy="220" r="35" fill="none" stroke="#EF4444" stroke-width="5" filter="url(#glow)"/>
  <circle cx="310" cy="220" r="8" fill="#EF4444" />
  
  <line x1="310" y1="175" x2="310" y2="190" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="310" y1="250" x2="310" y2="265" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="265" y1="220" x2="280" y2="220" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="335" y1="220" x2="350" y2="220" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>

  <!-- Scanning Line -->
  <line x1="100" y1="250" x2="400" y2="250" stroke="#00FFC2" stroke-width="3" opacity="0.8" filter="url(#glow)" />
</svg>
